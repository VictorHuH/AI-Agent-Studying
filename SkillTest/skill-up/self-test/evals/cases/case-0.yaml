id: case-0
title: MCP 标准请求
description: 基于 06-MCP.md 的 6 道自测题：题目可溯源到笔记真实标题、考点不重复、认知层次混合、不含答案
tag: functional_test
input:
    prompt: |
        考我 MCP，考全部，出 6 道题。（已确认：考全部内容、出 6 道题，中途无需再向用户确认，直接完成出题。）
context:
    files:
        06-MCP.md: 06-MCP.md
constraints: {}
expect:
    must_not_contain:
        - 参考答案
judge:
    type: agent_judge
    model: anthropic/glm-5.3[1M]
    criteria:
        - 正好 6 道题（一题含多个小问仍算一道）
        - 题目基于工作区中的 06-MCP.md，未混入其他笔记或笔记外知识
        - 每道题可溯源到 06-MCP.md 真实小节，无笔记里不存在的内容
        - 一个考点最多出一道题（两道题知识实质相同算重复）
        - 认知层次混合：至少覆盖 2 个布鲁姆层次（记忆/理解/应用/分析），不全是记忆层
        - 出题时不附带答案或解析（"答完我判分"这类流程说明不算泄题）
